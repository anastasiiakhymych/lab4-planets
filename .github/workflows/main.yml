
name: Python code checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install ruff mypy fastapi "uvicorn[standard]" "psycopg[binary]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Mypy
        run: python -m mypy main.py models.py
